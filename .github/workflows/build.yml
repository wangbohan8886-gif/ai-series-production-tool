name: build-installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with .NET Framework csc
        shell: powershell
        run: .\build.ps1

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AI-Series-Production-Tool_3.2.0.65-Setup
          path: out/AI-Series-Production-Tool_3.2.0.65-Setup.exe
          if-no-files-found: error
